function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + 'px';

}

// ============================ 4) الإدخال والاهتزاز والصوت ============================
const padStates = [];
let padApi = true;

window.addEventListener('gamepadconnected', () => {});
window.addEventListener('gamepaddisconnected', () => {});

// قراءة كل الدراعات — بتتنادى كل فريم
function pollGamepads() {
  let list = [];
  try {
    if (navigator.getGamepads) list = navigator.getGamepads() || [];
    else padApi = false;
  } catch (e) { padApi = false; }
  const n = Math.max(list.length, padStates.length);
  for (let i = 0; i < n; i++) {
    const st = padStates[i] || (padStates[i] = { connected: false, id: '', cur: [], prev: [], axes: [], nav: {}, navPrev: {} });
    st.prev = st.cur;
    st.navPrev = st.nav;
    const gp = list[i];
    if (gp && gp.connected) {
      st.connected = true;
      st.id = gp.id || '';
      st.cur = Array.from(gp.buttons, b => (typeof b === 'object' ? (b.pressed || b.value > 0.5) : b > 0.5));
      st.axes = Array.from(gp.axes);
      const lx = st.axes[0] || 0, ly = -(st.axes[1] || 0);
      st.nav = {
        up:    !!st.cur[BTN.UP]    || ly > 0.6,
        down:  !!st.cur[BTN.DOWN]  || ly < -0.6,
        left:  !!st.cur[BTN.LEFT]  || lx < -0.6,
        right: !!st.cur[BTN.RIGHT] || lx > 0.6
      };
    } else {
      st.connected = false; st.cur = []; st.axes = []; st.nav = {};
    }
  }
}

function pressed(i, b) {
  const s = padStates[i];
  return !!(s && s.connected && s.cur[b] && !s.prev[b]);
}
// الزرار مضغوط دلوقتي (للتسخين في الفرن)
function down(i, b) {
  const s = padStates[i];
  return !!(s && s.connected && s.cur[b]);
}
function navPressed(i, d) {
  const s = padStates[i];
  return !!(s && s.connected && s.nav[d] && !s.navPrev[d]);
}
// قراءة عصاية — Y معكوس (فوق = موجب)
function stick(i, ax, ay) {
  const s = padStates[i];
  if (!s || !s.connected) return { x: 0, y: 0 };
  return { x: s.axes[ax] || 0, y: -(s.axes[ay] || 0) };
}
function consume(i, b) { if (padStates[i]) padStates[i].prev[b] = true; }
function connectedPads() { return padStates.map((s, i) => ({ s, i })).filter(o => o.s.connected); }
function padOK(p) { return p.pad !== null && !!padStates[p.pad] && padStates[p.pad].connected; }
function anyBoundPressed(b) { return game.players.some(p => p.pad !== null && pressed(p.pad, b)); }
function anyBoundNav(d) { return game.players.some(p => p.pad !== null && navPressed(p.pad, d)); }
function anyPadNav(d) { return padStates.some((s, i) => navPressed(i, d)); }

// اهتزاز الدراع (لو بيدعمه)
function rumble(p, strong, weak, ms) {
  try {
    const gp = navigator.getGamepads()[p.pad];
    const v = gp && gp.vibrationActuator;
    if (v && v.playEffect) {
      const pr = v.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak });
      if (pr && pr.catch) pr.catch(() => {});
    }
  } catch (e) {}
}

// مؤثرات صوتية بسيطة متولدة بالكود (لو المتصفح سامح بالصوت)
let actx = null;
function audio() {
  if (actx === false) return null;
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { actx = false; return null; }
  }
  if (actx.state === 'suspended') { const pr = actx.resume(); if (pr && pr.catch) pr.catch(() => {}); }
  return actx.state === 'running' ? actx : null;
}
function tone(f, dur, type, vol, to, delay) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol || 0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, delay) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination);
  s.start(a.currentTime + (delay || 0));
}
const SFX = {
  ok:     () => { tone(660, 0.07, 'square', 0.05); tone(990, 0.09, 'square', 0.05, 0, 0.07); },

  tick:   () => tone(880, 0.06, 'square', 0.06),
  shove:  () => { noise(0.18, 0.3); tone(130, 0.22, 'sine', 0.35, 50); },
  miss:   () => noise(0.08, 0.06),
  flour:  () => noise(0.55, 0.22),
  chili:  () => { tone(300, 0.25, 'sawtooth', 0.06, 900); },
  oil:    () => tone(260, 0.2, 'sine', 0.1, 120),
  slip:   () => tone(800, 0.5, 'sawtooth', 0.07, 110),
  pickup: () => { tone(520, 0.06, 'square', 0.05); tone(780, 0.06, 'square', 0.05, 0, 0.06); tone(1040, 0.1, 'square', 0.05, 0, 0.12); },
  steal:  () => { tone(880, 0.08, 'sawtooth', 0.07); tone(440, 0.08, 'sawtooth', 0.07, 0, 0.08); tone(880, 0.16, 'sawtooth', 0.07, 0, 0.16); },
  ding:   () => { tone(1320, 0.5, 'sine', 0.12); tone(1760, 0.5, 'sine', 0.08, 0, 0.08); },
  buzz:   () => tone(140, 0.25, 'sawtooth', 0.08),
  serve:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.06, 0, i * 0.09)); },
  end:    () => { tone(440, 0.2, 'square', 0.07); tone(330, 0.4, 'square', 0.07, 0, 0.2); },
  win:    () => { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'square', 0.07, 0, i * 0.13)); }
};
function sfx(name) { try { if (SFX[name]) SFX[name](); } catch (e) {} }

function newStats() { return { rounds: 0, firsts: 0, shoves: 0, steals: 0, perfects: 0 }; }

const game = {

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// حالة الميني جيمز (بتتصفّر لما اللاعب يبدأ بيتزا جديدة)

// تجهيز اللاعب لراوند جديد
function resetPlayerRound(p) {
  const s = SPAWNS[p.id];
  p.x = s.x; p.y = s.y; p.a = -Math.PI / 2; p.walk = 0; p.moving = false; p.mvx = 0; p.mvy = -1;

function startMatch() {
  game.players.forEach(p => { p.total = 0; p.inv = 'flour'; p.stats = newStats(); });   // كل لاعب بيبدأ بكيس دقيق
  game.round = 1;
  startRound();
}
function startRound() {
  game.mod = game.round > ROUNDS ? 'sudden' : MODS[game.round - 1];
  game.order = pick(ORDERS);                     // نفس الطلب للاتنين: سباق عادل
  game.timeLeft = ROUND_TIME;
  game.roundOver = false; game.roundEndT = 0; game.paused = false;
  game.countT = 3.2; game.goT = 0; game.firstServed = false;
  game.crates = []; game.pizzas = []; game.spawnT = 4;
  game.puddles = game.mod === 'slippery'
    ? SPILLS.map(([x, y]) => ({ x, y, owner: -1, arm: 0, life: Infinity }))
    : [];
  game.players.forEach(p => { p.invAtRoundStart = p.inv; resetPlayerRound(p); });
  setScreen('play');
  sfx('count');
}
function restartRound() {
  game.players.forEach(p => { p.inv = p.invAtRoundStart; });
  startRound();
}
function quitToWelcome() {
  game.players = [makePlayer(0), makePlayer(1)];
  game.paused = false;
  setScreen('welcome');
}

// ============================ 6) منطق الشاشات ============================
function updateWelcome() {
  if (anyPadNav('left') && game.lang !== 'en') { game.lang = 'en'; sfx('nav'); }
  if (anyPadNav('right') && game.lang !== 'ar') { game.lang = 'ar'; sfx('nav'); }
  if (!inputReady()) return;
  for (let i = 0; i < padStates.length; i++) {
    if (pressed(i, BTN.A)) { game.players.forEach(p => { p.pad = null; }); game.bindMsgT = 0; setScreen('bind'); sfx('ok'); return; }
  }
}

// ربط الدراعات: اللاعب 1 ثم اللاعب 2 (ونرفض نفس الدراع)
function updateBind(dt) {
  const [p1, p2] = game.players;
  game.bindMsgT = Math.max(0, game.bindMsgT - dt);
  if (!inputReady()) return;
  for (let i = 0; i < padStates.length; i++) {
    if (pressed(i, BTN.B)) {
      sfx('back');
      if (p2.pad !== null) p2.pad = null;
      else if (p1.pad !== null) p1.pad = null;
      else setScreen('welcome');
      return;
    }
    if (pressed(i, BTN.A)) {
      if (p1.pad === null) { p1.pad = i; sfx('ok'); }
      else if (p2.pad === null) {
        if (i === p1.pad) { game.bindMsgT = 2.2; sfx('buzz'); }
        else { p2.pad = i; game.bindMsgT = 0; sfx('ok'); }
      } else if (i === p1.pad || i === p2.pad) { sfx('ok'); enterCharSelect(); }
      return;
    }
  }
}

function enterCharSelect() {
  game.players.forEach((p, i) => { p.charIdx = i; p.charConfirmed = false; p.charNote = 0; });
  game.charDoneT = 0;
  setScreen('charselect');
}
function updateCharSelect(dt) {
  const ps = game.players;
  ps.forEach(p => { p.charNote = Math.max(0, p.charNote - dt); });
  if (!inputReady()) return;
  const startDir = rtl() ? 'right' : 'left', endDir = rtl() ? 'left' : 'right';
  for (const p of ps) {
    const other = rival(p);
    if (!p.charConfirmed) {
      if (navPressed(p.pad, startDir) && p.charIdx !== 0) { p.charIdx = 0; sfx('nav'); }
      if (navPressed(p.pad, endDir) && p.charIdx !== 1) { p.charIdx = 1; sfx('nav'); }
      if (pressed(p.pad, BTN.A)) {
        // لو الشخصية متاخدة، التانية تتغير تلقائي
        if (other.charConfirmed && other.charIdx === p.charIdx) { p.charIdx = 1 - p.charIdx; p.charNote = 3; }
        p.charConfirmed = true; sfx('ok');
      } else if (pressed(p.pad, BTN.B)) { sfx('back'); setScreen('bind'); return; }
    } else if (pressed(p.pad, BTN.B)) { p.charConfirmed = false; game.charDoneT = 0; sfx('back'); }
  }
  if (ps.every(p => p.charConfirmed)) {
    game.charDoneT += dt;
    if (game.charDoneT > 1.0) setScreen('rules');
  }
}

function updateRules() {
  if (!inputReady()) return;
  if (anyBoundPressed(BTN.A)) { sfx('ok'); startMatch(); }
  else if (anyBoundPressed(BTN.B)) { sfx('back'); enterCharSelect(); }
}

function updateRoundResult() {
  if (!inputReady(0.7)) return;
  if (anyBoundPressed(BTN.A)) {
    const [a, b] = game.players;
    if (game.round < ROUNDS) { game.round++; startRound(); }
    else if (game.round === ROUNDS && a.total === b.total) { game.round++; startRound(); }   // تعادل → موت مفاجئ
    else { game.winnerIdx = 0; setScreen('winner'); sfx('win'); }
  }
}

function updateWinner() {
  if (!inputReady(0.7)) return;
  if (anyBoundNav(rtl() ? 'right' : 'left')) game.winnerIdx = 0;
  if (anyBoundNav(rtl() ? 'left' : 'right')) game.winnerIdx = 1;
  if (anyBoundPressed(BTN.B)) { sfx('back'); quitToWelcome(); return; }
  if (anyBoundPressed(BTN.A)) { sfx('ok'); if (game.winnerIdx === 0) startMatch(); else quitToWelcome(); }
}

// لو دراع اتفصل ومارجعش بنفس الرقم: أي دراع جديد يضغط A ياخد مكانه
function tryRebind() {
  for (const p of game.players) {
    if (p.pad === null || padOK(p)) continue;
    for (let i = 0; i < padStates.length; i++) {
      if (game.players.some(q => q.pad === i)) continue;
      if (pressed(i, BTN.A)) { p.pad = i; consume(i, BTN.A); break; }
    }
  }
}

function cellAt(x, y) {
  if (y < 0 || y >= MAP.length || x < 0 || x >= MAP[0].length) return '#';
  return MAP[y][x];
}

// تصادم اللاعب مع الخريطة: أي خلية مش أرض تعتبر حاجز
function checkCollision(x, y) {
  const r = BODY_R;
  return cellAt(Math.floor(x - r), Math.floor(y - r)) !== '.' || cellAt(Math.floor(x + r), Math.floor(y - r)) !== '.' ||
         cellAt(Math.floor(x - r), Math.floor(y + r)) !== '.' || cellAt(Math.floor(x + r), Math.floor(y + r)) !== '.';
}
// اللاعبين مايعدّوش من بعض
function bumpsRival(nx, ny, p) {
  const o = rival(p);
  const dNew = Math.hypot(nx - o.x, ny - o.y);
  return dNew < 0.5 && dNew < Math.hypot(p.x - o.x, p.y - o.y);
}

function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
// أقرب نقطة من خطوط المحطة + المسافة + فرق الزاوية عن اتجاه نظر اللاعب
function stationInfo(p, key) {
  let best = null;
  for (const [x0, y0, x1, y1] of STATIONS[key].segs) {
    const dx = x1 - x0, dy = y1 - y0, L = dx * dx + dy * dy;
    const t = L ? clamp(((p.x - x0) * dx + (p.y - y0) * dy) / L, 0, 1) : 0;
    const qx = x0 + dx * t - p.x, qy = y0 + dy * t - p.y, d = Math.hypot(qx, qy);
    if (!best || d < best.d) best = { d, diff: angDiff(Math.atan2(qy, qx), p.a) };
  }
  return best;
}
function canUse(p, key, reach) {
  const i = stationInfo(p, key);
  return i.d < (reach || REACH) && Math.abs(i.diff) < 1.25;
}

// المرحلة الحالية بتتحسب من اللي في إيد اللاعب
function phaseOf(p) {
  if (p.finished) return 'done';
  if (p.item && p.item.stage === 'baked') return 'serve';
  if (!p.heard) return 'order';
  if (!p.item) return 'dough';
  return p.item.stage === 'dough' ? 'toppings' : 'bake';
}
function stageOf(p) {
  if (p.finished) return 5;
  if (!p.item) return p.heard ? 1 : 0;
  return p.item.stage === 'dough' ? 2 : p.item.stage === 'topped' ? 3 : 4;
}

// الهدف الحالي: محطة المرحلة، أو بيتزا واقعة على الأرض
function targetOf(p) {
  if (p.finished) return null;
  if (!(p.item && p.item.stage === 'baked') && game.pizzas.length) {
    let best = game.pizzas[0];
    for (const z of game.pizzas) if (Math.hypot(z.x - p.x, z.y - p.y) < Math.hypot(best.x - p.x, best.y - p.y)) best = z;
    return { key: 'pizza', pts: [{ x: best.x, y: best.y, z: 0.6 }] };
  }
  const key = PHASE_STATION[p.phase];
  return key ? { key, pts: STATIONS[key].marks } : null;
}

function toast(p, text, color) { p.toast = { text, t: 2.2, color: color || 'rgba(45,28,12,.85)' }; }

// اللف بالعصاية اليمين
function look(p, dt) {
  const R = stick(p.pad, 2, 3);
  if (Math.abs(R.x) > LOOK_DEADZONE) {
    const v = Math.min(1, (Math.abs(R.x) - LOOK_DEADZONE) / (1 - LOOK_DEADZONE));
    p.a = angDiff(p.a + Math.sign(R.x) * v * TURN_SPEED * dt, 0);
  }
}
// المشي بالعصاية الشمال — سرعة ثابتة (والشطة بتزوّدها)
function walk(p, dt) {
  const L = stick(p.pad, 0, 1);
  const m = Math.hypot(L.x, L.y);
  p.moving = false;
  if (m < MOVE_DEADZONE) return;
  p.moving = true;
  p.walk += dt * 10;
  const dirX = Math.cos(p.a), dirY = Math.sin(p.a);
  const f = L.y / m, s = L.x / m;
  const ux = dirX * f - dirY * s, uy = dirY * f + dirX * s;
  p.mvx = ux; p.mvy = uy;
  const dist = MOVE_SPEED * (p.boostT > 0 ? BOOST_MULT : 1) * dt, steps = Math.max(1, Math.ceil(dist / 0.04));
  const vx = ux * dist / steps, vy = uy * dist / steps;
  for (let k = 0; k < steps; k++) {
    if (!checkCollision(p.x + vx, p.y) && !bumpsRival(p.x + vx, p.y, p)) p.x += vx;
    if (!checkCollision(p.x, p.y + vy) && !bumpsRival(p.x, p.y + vy, p)) p.y += vy;
  }
}
// حركة إجبارية (زقّة أو تزحلق)
function slideMove(p, dx, dy) {
  const dist = Math.hypot(dx, dy), steps = Math.max(1, Math.ceil(dist / 0.04));
  const vx = dx / steps, vy = dy / steps;
  for (let k = 0; k < steps; k++) {
    if (!checkCollision(p.x + vx, p.y)) p.x += vx;
    if (!checkCollision(p.x, p.y + vy)) p.y += vy;
  }
}

function orderName(o) { return T('orders')[o.idx]; }
function orderItemsText(o) { return o.items.map(i => T('ingredients')[i]).join(' + '); }

// ---- المنافسة: الزقّ ----
function kickFromMini(o) {
  if (o.mini === 'bake' && o.bake.result) finishBake(o);
  else if (o.mini === 'toppings' && o.top.doneT > 0) finishToppings(o);
  else if (o.mini === 'dough' && o.dough.doneT > 0) finishDough(o);
  o.mini = null;
}
// البيتزا المخبوزة بتقع على الأرض (وكل وقعة بتقلل جودتها)
function dropPizza(o) {
  if (!o.item || o.item.stage !== 'baked') return false;
  o.item.drops++;
  game.pizzas.push({ x: o.x, y: o.y, item: o.item, age: 0 });
  o.item = null;
  resetMini(o);
  return true;
}
function tryShove(p) {
  if (p.shoveCd > 0) return;
  const o = rival(p);
  const dx = o.x - p.x, dy = o.y - p.y, d = Math.hypot(dx, dy) || 0.001;
  p.lungeT = 0.25;
  if (d < SHOVE_RANGE && Math.abs(angDiff(Math.atan2(dy, dx), p.a)) < SHOVE_ARC && o.immuneT <= 0) {
    p.shoveCd = SHOVE_CD;
    p.stats.shoves++;
    o.stunT = STUN_TIME; o.immuneT = STUN_TIME + IMMUNE_TIME;
    o.kvx = dx / d * 5.5; o.kvy = dy / d * 5.5; o.kT = 0.25;
    o.slipT = 0;
    kickFromMini(o);
    const dropped = dropPizza(o);
    toast(p, T('toast').shoveHit, '#3aa655');
    toast(o, dropped ? T('toast').dropped : T('toast').shoved, '#c8362b');
    rumble(o, 1, 0.6, 350); rumble(p, 0.3, 0.3, 120);
    sfx('shove');
  } else {
    p.shoveCd = SHOVE_MISS_CD;
    sfx('miss');
  }
}

// ---- المنافسة: الأدوات ----
function useItem(p) {
  if (!p.inv) return;
  const o = rival(p), type = p.inv;
  p.inv = null;
  if (type === 'flour') {
    o.flourT = FLOUR_TIME;
    toast(o, T('toast').floured, '#c8362b'); toast(p, T('toast').flourHit, '#3aa655');
    rumble(o, 0.3, 0.8, 400); sfx('flour');
  } else if (type === 'chili') {
    p.boostT = BOOST_TIME;
    toast(p, T('toast').chili, '#e4572e'); sfx('chili');
  } else {
    // بقعة زيت ورا اللاعب: الخصم لو داس عليها يتزحلق
    const bx = p.x - Math.cos(p.a) * 0.55, by = p.y - Math.sin(p.a) * 0.55;
    const ok = cellAt(Math.floor(bx), Math.floor(by)) === '.';
    game.puddles.push({ x: ok ? bx : p.x, y: ok ? by : p.y, owner: p.id, arm: 0.5, life: 25 });
    toast(p, T('toast').oil, '#b8860b'); sfx('oil');
  }
}
function slip(p) {
  p.slipT = SLIP_TIME; p.slipImm = SLIP_TIME + 1.5;
  const m = Math.hypot(p.mvx, p.mvy);
  if (p.moving && m > 0.1) { p.sdx = p.mvx / m; p.sdy = p.mvy / m; }
  else { p.sdx = Math.cos(p.a); p.sdy = Math.sin(p.a); }
  const dropped = dropPizza(p);
  toast(p, dropped ? T('toast').dropped : T('toast').slip, '#c8362b');
  rumble(p, 0.8, 0.4, 350); sfx('slip');
}
function checkPuddles(p) {
  if (p.slipImm > 0) return;
  for (let i = 0; i < game.puddles.length; i++) {
    const pd = game.puddles[i];
    if (pd.owner === p.id || pd.arm > 0) continue;
    if (Math.hypot(pd.x - p.x, pd.y - p.y) < 0.5) {
      if (pd.owner >= 0) game.puddles.splice(i, 1); else pd.arm = 2.5;
      slip(p);
      return;
    }
  }
}
// التقاط الصناديق والبيتزا اللي على الأرض
function pickups(p) {
  if (!p.inv) {
    const i = game.crates.findIndex(c => Math.hypot(c.x - p.x, c.y - p.y) < 0.55);
    if (i >= 0) {
      p.inv = game.crates[i].type;
      game.crates.splice(i, 1);
      toast(p, T('toast').got(T('items')[p.inv]), '#2f7fd1');
      sfx('pickup');
    }
  }
  if (!p.finished && !(p.item && p.item.stage === 'baked')) {
    const i = game.pizzas.findIndex(z => z.age > 0.35 && Math.hypot(z.x - p.x, z.y - p.y) < 0.6);
    if (i >= 0) {
      const it = game.pizzas[i].item;
      game.pizzas.splice(i, 1);
      if (p.item) resetMini(p);                    // اللي كان في إيده بيترمي
      p.item = it;
      if (it.maker !== p.id) {                     // سرقة!
        p.stats.steals++;
        toast(p, T('toast').stole, '#3aa655'); toast(rival(p), T('toast').stolen, '#c8362b');
        rumble(rival(p), 0.6, 0.6, 250); sfx('steal');
      } else { toast(p, T('toast').back, '#3aa655'); sfx('pickup'); }
    }
  }
}
function spawnCrates() {
  const free = CRATE_PAIRS.filter(pair => pair.every(([x, y]) => !game.crates.some(c => c.x === x && c.y === y)));
  if (!free.length) return;
  const type = pick(ITEM_TYPES);                   // نفس الأداة للناحيتين: عدل
  pick(free).forEach(([x, y]) => game.crates.push({ x, y, type }));
}
function updateWorld(dt) {
  game.spawnT -= dt;
  if (game.spawnT <= 0) { game.spawnT = CRATE_EVERY; spawnCrates(); }
  game.pizzas.forEach(z => { z.age += dt; });
  game.puddles = game.puddles.filter(pd => { pd.arm = Math.max(0, pd.arm - dt); pd.life -= dt; return pd.life > 0; });
}

function tickTimers(p, dt) {
  p.flourT = Math.max(0, p.flourT - dt);
  p.stunT = Math.max(0, p.stunT - dt);
  p.immuneT = Math.max(0, p.immuneT - dt);
  p.slipImm = Math.max(0, p.slipImm - dt);
  p.boostT = Math.max(0, p.boostT - dt);
  p.shoveCd = Math.max(0, p.shoveCd - dt);
  p.lungeT = Math.max(0, p.lungeT - dt);
  if (p.toast) { p.toast.t -= dt; if (p.toast.t <= 0) p.toast = null; }
  if (p.bubble && p.bubble.t !== Infinity) { p.bubble.t -= dt; if (p.bubble.t <= 0) p.bubble = null; }
}

// تحديث لاعب واحد في الراوند
function updatePlayer(p, dt) {
  tickTimers(p, dt);
  if (p.kT > 0) { p.kT -= dt; slideMove(p, p.kvx * dt, p.kvy * dt); }
  if (p.stunT > 0) { p.moving = false; p.phase = phaseOf(p); return; }       // دايخ من الزقّة
  if (p.slipT > 0) {                                                          // بيتزحلق ويلف حوالين نفسه
    p.slipT -= dt;
    p.a = angDiff(p.a + (Math.PI * 2 / SLIP_TIME) * dt, 0);
    slideMove(p, p.sdx * 3.4 * dt, p.sdy * 3.4 * dt);
    p.phase = phaseOf(p);
    return;
  }
  if (pressed(p.pad, BTN.X)) useItem(p);                                      // X = استخدم الأداة

  if (p.mini) {
    if (p.mini === 'dough') updateDough(p, dt);
    else if (p.mini === 'toppings') updateToppings(p, dt);
    else updateBake(p, dt);
    p.phase = phaseOf(p);
    return;
  }
  if (pressed(p.pad, BTN.B) || pressed(p.pad, BTN.RB)) tryShove(p);           // B = زُق
  look(p, dt);
  walk(p, dt);
  pickups(p);
  checkPuddles(p);
  p.phase = phaseOf(p);
  if (p.finished || p.slipT > 0) return;

  if (p.phase === 'order') {                    // المرحلة 1: اسمع الطلب
    if (canUse(p, 'customer', 1.9)) {
      p.heard = true;
      p.bubble = { text: T('want', orderName(game.order), orderItemsText(game.order)), t: 4.5 };
      toast(rival(p), T('toast').rOrder);
      sfx('ok');
      p.phase = phaseOf(p);
    }
  } else if (pressed(p.pad, BTN.A) && canUse(p, PHASE_STATION[p.phase])) {
    if (p.phase === 'serve') servePizza(p);
    else { p.mini = p.phase; sfx('ok'); }       // dough / toppings / bake
  }
}

// --- المرحلة 2: العجن بالعصاية اليمين ---
function paintSector(d, idx, r) { d.radii[idx] = r; d.painted[idx] = true; }
const avg = arr => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0);

// جودة العجينة لحد دلوقتي (بتتعرض للاعب ولخصمه)
function doughQuality(d) {
  const parts = [d.step > 0 ? d.q1 : clamp(1 - d.bad / 2.5, 0, 1)];
  if (d.step > 1) parts.push(d.q2);
  if (d.catches.length) parts.push(avg(d.catches));
  return avg(parts);
}
function finishDough(p) {
  const d = p.dough;
  p.item = { stage: 'dough', dough: (d.q1 + d.q2 + d.q3) / 3, toppings: 0, bake: 0, maker: p.id, drops: 0 };
  p.mini = null;
  toast(rival(p), T('toast').rDough);
  sfx('ok');
}

// التقنية 1 — العجن: لف العصاية في اتجاه الأسهم بإيقاع ثابت، والاتجاه بيتعكس بعد كل طيّة.
// السرعة الزيادة بتقطّع العجينة، واللف في الاتجاه الغلط بيرجّعك لورا.
function kneadStep(p, d, s, m, dt) {
  if (m > 0.5 && dt > 0) {
    const ang = Math.atan2(s.y, s.x);
    if (d.lastAng !== null) {
      const da = angDiff(ang, d.lastAng), mag = Math.abs(da);
      if (mag < 2) {
        d.speed += (mag / (Math.PI * 2) / dt - d.speed) * Math.min(1, dt * 8);
        if (mag > 0.002) {
          if (Math.sign(da) === d.dir) d.prog += mag;
          else { d.prog = Math.max(0, d.prog - mag); d.bad += mag / (Math.PI * 2) * 0.6; d.warn = 'wrong'; d.warnT = 0.5; }
        }
      }
    }
    d.lastAng = ang;
  } else { d.lastAng = null; d.speed += (0 - d.speed) * Math.min(1, dt * 8); }
  if (d.speed > KNEAD_MAX) { d.bad += dt; d.warn = 'fast'; d.warnT = 0.4; }
  if (d.prog >= Math.PI * 2) {
    d.folds++; d.prog = 0; d.dir = -d.dir;
    sfx('nav'); rumble(p, 0.2, 0.3, 80);
    if (d.folds >= KNEAD_FOLDS) { d.q1 = clamp(1 - d.bad / 2.5, 0, 1); d.step = 1; d.lastIdx = -1; sfx('ok'); }
  }
}

// التقنية 2 — الفرد: امشي على الحلقة المنقطة كلها (72 قطاع) وإنت ماسك العصاية على نفس البعد
function shapeStep(p, d, s, m) {
  if (m > DOUGH_DEADZONE) {
    m = Math.min(m, 1);
    const ang = (Math.atan2(s.y, s.x) + Math.PI * 2) % (Math.PI * 2);
    const idx = Math.floor(ang / (Math.PI * 2) * SECTORS) % SECTORS;
    if (d.lastIdx >= 0) {                         // املا القطاعات اللي العصاية نطّتها
      let diff = idx - d.lastIdx;
      if (diff > SECTORS / 2) diff -= SECTORS;
      if (diff < -SECTORS / 2) diff += SECTORS;
      const n = Math.abs(diff);
      if (n > 1 && n <= 12) {
        const step = Math.sign(diff);
        for (let j = 1; j < n; j++) {
          const q = ((d.lastIdx + step * j) % SECTORS + SECTORS) % SECTORS;
          paintSector(d, q, d.lastM + (m - d.lastM) * j / n);
        }
      }
    }
    paintSector(d, idx, m);
    d.lastIdx = idx; d.lastM = m;
  } else d.lastIdx = -1;

  // التغطية = القطاعات / 72 ، النعومة = 1 - (الانحراف المعياري / أكبر radius) ، الدقة = القرب من الحلقة
  const rs = d.radii.filter((_, i) => d.painted[i]);
  d.coverage = rs.length / SECTORS;
  if (rs.length) {
    const mean = avg(rs);
    const sd = Math.sqrt(avg(rs.map(r => (r - mean) * (r - mean))));
    d.smooth = clamp(1 - sd / Math.max(...rs), 0, 1);
    d.acc = avg(rs.map(r => 1 - Math.min(1, Math.abs(r - IDEAL_R) / 0.3)));
  } else { d.smooth = 0; d.acc = 0; }

  if (pressed(p.pad, BTN.A) && d.coverage >= 1) {
    d.q2 = d.smooth * 0.5 + d.acc * 0.5;
    d.step = 2; d.air = -1; d.armed = false;
    sfx('ok');
  }
}

// التقنية 3 — الرمي: ارمي العجينة لفوق، لفّها في الهوا، وامسكها بـ A في اللحظة الصح
function tossStep(p, d, s, m, dt) {
  if (d.showT > 0) {
    d.showT -= dt;
    if (d.showT <= 0 && d.tosses >= TOSSES) { d.q3 = avg(d.catches); d.doneT = 0.5; }
    return;
  }
  if (d.air < 0) {                                // العجينة على الإيد
    if (s.y < 0.3) d.armed = true;
    if (d.armed && s.y > 0.75) { d.air = 0; d.armed = false; d.spin = 0; d.spinAng = null; sfx('chili'); }
    return;
  }
  d.air += dt;
  if (m > 0.5) {                                  // اللف في الهوا
    const ang = Math.atan2(s.y, s.x);
    if (d.spinAng !== null) {
      const da = angDiff(ang, d.spinAng);
      if (Math.abs(da) < 2) { d.spin += Math.abs(da) / (Math.PI * 2); d.rot += da; }
    }
    d.spinAng = ang;
  } else d.spinAng = null;
  const e = Math.abs(d.air - TOSS_AIR);
  let zi = -1;
  if (pressed(p.pad, BTN.A)) zi = e <= 0.08 ? 0 : e <= 0.18 ? 1 : e <= 0.30 ? 2 : 3;
  else if (d.air > TOSS_AIR + 0.30) zi = 3;       // ماتمسكتش: وقعت
  if (zi >= 0) {
    const catchQ = [1, 0.7, 0.4, 0][zi];
    d.catches.push(catchQ * (0.6 + 0.4 * Math.min(1, d.spin / 2)));     // لفتين كاملين = أحسن نتيجة
    d.lastCatch = { zi, spin: d.spin };
    d.tosses++; d.air = -1; d.showT = 0.7;
    if (zi === 0) { sfx('ding'); rumble(p, 0.2, 0.6, 150); }
    else if (zi === 3) { sfx('buzz'); rumble(p, 0.6, 0.2, 200); }
    else sfx('ok');
  }
}

// --- المرحلة 2: العجينة (تلات تقنيات ورا بعض) ---
function updateDough(p, dt) {
  const d = p.dough;
  d.warnT = Math.max(0, d.warnT - dt);
  if (d.doneT > 0) { d.doneT -= dt; if (d.doneT <= 0) finishDough(p); return; }
  const s = stick(p.pad, 2, 3);
  const m = Math.hypot(s.x, s.y);
  const k = m > 1 ? 1 / m : 1;
  d.px = s.x * k; d.py = s.y * k;                 // مكان المؤشر (بدون أي تنعيم أو acceleration)
  if (d.step === 0) kneadStep(p, d, s, m, dt);
  else if (d.step === 1) shapeStep(p, d, s, m);
  else tossStep(p, d, s, m, dt);
  if (pressed(p.pad, BTN.B) && d.doneT <= 0) { p.mini = null; sfx('back'); }
}

// --- المرحلة 3: المكونات — اختار المكوّن الصح، وبعدين نزّل القطع على العلامات والبيتزا بتلف ---
const RING = [0.5, 0.76, 0.28, 0.62];             // بُعد كل مكوّن عن مركز البيتزا
const PIECE = [17, 14, 12, 12];                   // حجم القطعة
function topQuality(t) {
  const all = t.accs.slice();
  const cur = t.marks.filter(mk => mk.filled).map(mk => mk.acc);
  if (cur.length) all.push(avg(cur));
  return (all.length ? avg(all) : 1) * Math.max(0, 1 - 0.1 * t.wrong) * Math.max(0.5, 1 - 0.04 * t.waste);
}
function startDrop(t, i) {
  t.mode = 'drop'; t.cur = i; t.dirn = -t.dirn;
  const off = Math.random() * Math.PI * 2;
  t.marks = [];
  for (let k = 0; k < N_MARKS; k++) t.marks.push({ ang: off + k * Math.PI * 2 / N_MARKS, filled: false, acc: 0 });
  t.strays = [];
}
function finishToppings(p) {
  p.item.stage = 'topped'; p.item.toppings = p.top.score;
  p.mini = null;
  toast(rival(p), T('toast').rTop);
}
function updateToppings(p, dt) {
  const t = p.top;
  t.shake = Math.max(0, t.shake - dt);
  t.msgT = Math.max(0, t.msgT - dt);
  t.rot += t.dirn * (0.38 + 0.04 * Math.min(game.round, 6)) * Math.PI * 2 * dt;     // كل راوند البيتزا بتلف أسرع
  if (t.doneT > 0) {
    t.doneT -= dt;
    if (t.doneT <= 0) finishToppings(p);
    return;
  }
  if (t.mode === 'pick') {
    if (navPressed(p.pad, rtl() ? 'left' : 'right') && t.focus < 3) { t.focus++; sfx('nav'); }
    if (navPressed(p.pad, rtl() ? 'right' : 'left') && t.focus > 0) { t.focus--; sfx('nav'); }
    if (pressed(p.pad, BTN.A)) {
      if (t.done[t.focus]) return;
      if (game.order.items.includes(t.focus)) { startDrop(t, t.focus); sfx('ok'); }
      else {                                      // مكوّن مش في الطلب = خصم 10%
        t.wrong++; t.shake = 0.45; t.wrongIdx = t.focus; t.msg = 'wrong'; t.msgT = 0.9;
        sfx('buzz'); rumble(p, 0.4, 0.2, 150);
      }
    } else if (pressed(p.pad, BTN.B)) { p.mini = null; sfx('back'); }
    return;
  }
  // وضع التنزيل: A بينزّل قطعة تحت الصبّابة
  if (pressed(p.pad, BTN.A)) {
    const local = -Math.PI / 2 - t.rot;           // الزاوية اللي تحت الصبّابة دلوقتي
    let best = null, bd = 9;
    for (const mk of t.marks) {
      if (mk.filled) continue;
      const dd = Math.abs(angDiff(mk.ang, local));
      if (dd < bd) { bd = dd; best = mk; }
    }
    if (best && bd <= DROP_TOL) {
      best.filled = true;
      best.acc = bd <= 0.07 ? 1 : 1 - 0.5 * (bd - 0.07) / (DROP_TOL - 0.07);
      t.placed[t.cur].push(local);
      sfx(best.acc >= 1 ? 'ding' : 'ok');
      if (t.marks.every(mk => mk.filled)) {
        t.accs.push(avg(t.marks.map(mk => mk.acc)));
        t.done[t.cur] = true; t.mode = 'pick'; t.cur = -1; t.marks = [];
        if (game.order.items.every(i => t.done[i])) { t.score = topQuality(t); t.doneT = 0.7; }
      }
    } else {                                      // برّه العلامة: قطعة ضايعة
      t.waste++; t.strays.push(local); t.msg = 'miss'; t.msgT = 0.6;
      sfx('buzz');
    }
  } else if (pressed(p.pad, BTN.B)) { p.mini = null; sfx('back'); }
}

// --- المرحلة 4: الخبز — دوس A للتسخين وسيبه للتبريد، وخليك جوه المنطقة الخضرا اللي بتتحرك ---
const BAKE_ZONES = [
  { s: 1.0, color: '#3aa655' }, { s: 0.7, color: '#d9a400' },
  { s: 0.4, color: '#e07b22' }, { s: 0.1, color: '#c8362b' }
];
function bandCenter(b) {
  const t = b.t + b.seed;
  return 0.52 + 0.2 * Math.sin(t * 1.25) + 0.09 * Math.sin(t * 2.9 + 1.3);
}
function finishBake(p) {
  p.item.stage = 'baked'; p.item.bake = p.bake.result.s;
  p.mini = null;
  toast(rival(p), T('toast').rBake);
}
function updateBake(p, dt) {
  const b = p.bake;
  if (b.result) {
    b.endT -= dt;
    if (b.endT <= 0) finishBake(p);
    return;
  }
  const held = down(p.pad, BTN.A);
  b.vel += ((held ? 0.8 : -0.65) - b.vel) * Math.min(1, dt * 5);
  b.T = clamp(b.T + b.vel * dt, 0, 1);
  if (b.T <= 0 || b.T >= 1) b.vel = 0;
  const d = Math.abs(b.T - bandCenter(b));
  b.zi = d <= 0.075 ? 0 : d <= 0.16 ? 1 : d <= 0.28 ? 2 : 3;     // مثالي 100% · قريب 70% · بعيد 40% · برّه 10%
  b.qsum += BAKE_ZONES[b.zi].s * dt;
  b.t += dt;
  if (b.t >= BAKE_TIME) {
    const s = b.qsum / b.t;
    const zi = s >= 0.85 ? 0 : s >= 0.62 ? 1 : s >= 0.38 ? 2 : 3;
    b.result = { zi, s, color: BAKE_ZONES[zi].color };
    b.endT = 1.0;
    if (zi === 0) { p.stats.perfects++; sfx('ding'); rumble(p, 0.2, 0.6, 200); } else sfx(zi === 3 ? 'buzz' : 'ok');
  } else if (pressed(p.pad, BTN.B)) { p.mini = null; sfx('back'); }
}

// --- المرحلة 5: التقديم ---
// السكور: مكونات 30 + عجينة 30 + خبز 20 + سرعة 20 (+ البونصات) × مضاعف الراوند
function computeScore(p, served, first) {
  const sc = p.scores, it = p.item;
  // كل وقعة بتخصم 15%، والبيتزا اللي ماتسلّمتش بتتحسب بنص قيمتها
  const pen = it ? Math.pow(DROP_PENALTY, it.drops) * (served ? 1 : 0.5) : 1;
  sc.dough = it ? Math.round(30 * it.dough * pen) : 0;
  sc.toppings = it && it.stage !== 'dough' ? Math.round(30 * it.toppings * pen) : 0;
  sc.bake = it && it.stage === 'baked' ? Math.round(20 * it.bake * pen) : 0;
  sc.speed = served ? Math.round(20 * clamp(game.timeLeft / ROUND_TIME, 0, 1)) : 0;
  sc.bonus = first ? (game.mod === 'rush' ? FIRST_BONUS * 2 : FIRST_BONUS) : 0;
  sc.mult = game.mod === 'double' ? 2 : 1;
  sc.craft = 0; sc.awards = {};
  sc.total = (sc.toppings + sc.dough + sc.bake + sc.speed + sc.bonus) * sc.mult;
  sc.served = served;
  sc.stolen = served && it.maker !== p.id;
}
// مبارزة الصنعة: أحسن عجينة / مكونات / خبز في الراوند ياخد +5 (البيتزا المسروقة ماتتحسبش)
function applyAwards() {
  const [a, b] = game.players;
  ['toppings', 'dough', 'bake'].forEach(k => {
    if (a.scores[k] === b.scores[k]) return;
    const w = a.scores[k] > b.scores[k] ? a : b;
    if (w.scores.stolen) return;
    w.scores.awards[k] = true; w.scores.craft += CRAFT_BONUS;
  });
  game.players.forEach(p => {
    const sc = p.scores;
    sc.total = (sc.toppings + sc.dough + sc.bake + sc.speed + sc.bonus + sc.craft) * sc.mult;
  });
}
function commentFor(score) {
  const tiers = T('comments');
  for (let i = 0; i < COMMENT_MIN.length; i++) if (score >= COMMENT_MIN[i]) return pick(tiers[i]);
  return '';
}
function servePizza(p) {
  const o = rival(p), first = !game.firstServed;
  game.firstServed = true;
  computeScore(p, true, first);
  const sc = p.scores;
  p.servedItem = p.item; p.item = null;
  p.finished = true; p.phase = 'done';
  p.bubble = { text: sc.stolen ? pick(T('stolenComments')) : commentFor(sc.toppings + sc.dough + sc.bake + sc.speed), t: Infinity };
  if (first) {
    p.stats.firsts++;
    toast(p, T('toast').first(sc.bonus), '#3aa655');
    toast(o, T('toast').rServed, '#c8362b');
  } else toast(o, T('toast').rServed2);
  sfx('serve'); rumble(p, 0.5, 0.5, 250);
}

// نهاية الراوند: الاتنين سلّموا أو الوقت خلص
function endRound() {
  game.roundOver = true; game.roundEndT = 2.8;
  for (const p of game.players) {
    if (p.finished) continue;
    if (p.mini) kickFromMini(p);
    computeScore(p, false, false);                // اللي ماسلّمش ياخد نص نقاط اللي في إيده بس
    p.bubble = { text: pick(T('timeouts')), t: Infinity };
  }
  applyAwards();
  sfx('end');
}
function finishRound() {
  const [a, b] = game.players;
  game.players.forEach(p => { p.total += p.scores.total; });
  if (a.scores.total !== b.scores.total) (a.scores.total > b.scores.total ? a : b).stats.rounds++;
  setScreen('roundResult');
}

// --- Pause ---
function openPause() { game.paused = true; game.pauseIdx = 0; game.pauseShake = 0; }
function updatePause(dt) {
  game.pauseShake = Math.max(0, game.pauseShake - dt);
  const missing = game.players.some(p => !padOK(p));
  const resume = () => { if (missing) game.pauseShake = 0.4; else game.paused = false; };
  if (anyBoundNav('up')) { game.pauseIdx = (game.pauseIdx + 2) % 3; sfx('nav'); }
  if (anyBoundNav('down')) { game.pauseIdx = (game.pauseIdx + 1) % 3; sfx('nav'); }
  if (anyBoundPressed(BTN.A)) {
    if (game.pauseIdx === 0) resume();
    else if (game.pauseIdx === 1) restartRound();
    else quitToWelcome();
  } else if (anyBoundPressed(BTN.START) || anyBoundPressed(BTN.B)) resume();
}

function updatePlay(dt) {
  if (!game.paused && game.players.some(p => !padOK(p))) openPause();   // دراع اتفصل: Pause تلقائي
  if (game.paused) { updatePause(dt); return; }
  if (anyBoundPressed(BTN.START)) { openPause(); return; }

  if (game.roundOver) {
    game.roundEndT -= dt;
    game.players.forEach(p => tickTimers(p, dt));
    if (game.roundEndT <= 0) finishRound();
    return;
  }
  if (game.countT > 0) {                          // العد التنازلي: تقدر تبص حواليك بس
    const before = Math.ceil(game.countT);
    game.countT -= dt;
    game.players.forEach(p => look(p, dt));
    if (game.countT <= 0) { game.goT = 0.9; sfx('go'); }
    else if (Math.ceil(game.countT) !== before) sfx('count');
    return;
  }
  game.goT = Math.max(0, game.goT - dt);
  const secBefore = Math.ceil(game.timeLeft);
  game.timeLeft -= dt;
  if (game.timeLeft > 0 && game.timeLeft <= 5 && Math.ceil(game.timeLeft) !== secBefore) sfx('tick');
  updateWorld(dt);
  game.players.forEach(p => updatePlayer(p, dt));
  if (game.timeLeft <= 0) { game.timeLeft = 0; endRound(); }
  else if (game.players.every(p => p.finished)) endRound();
  else if (game.mod === 'sudden' && game.players.some(p => p.finished)) endRound();
}

function update(dt) {
  if (game.screen !== 'welcome' && game.screen !== 'bind') tryRebind();
  switch (game.screen) {
    case 'welcome':     updateWelcome(); break;
    case 'bind':        updateBind(dt); break;
    case 'charselect':  updateCharSelect(dt); break;
    case 'rules':       updateRules(); break;
    case 'play':        updatePlay(dt); break;
    case 'roundResult': updateRoundResult(); break;
    case 'winner':      updateWinner(); break;
  }
}

// ============================ 8) أدوات الرسم ============================
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function txt(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 700) + ' ' + size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function txtFit(s, x, y, size, color, align, weight, maxW) {
  ctx.font = (weight || 700) + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  if (w > maxW) size = Math.max(9, size * maxW / w);
  txt(s, x, y, size, color, align, weight);
}
function wrapText(s, maxW, size, weight) {
  ctx.font = (weight || 700) + ' ' + size + 'px ' + FONT;
  const words = s.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
// فقرة بتتكسر على كذا سطر — بترجّع ارتفاعها
function para(s, x, y, maxW, size, lh, color, align, weight) {
  const lines = wrapText(s, maxW, size, weight || 600);
  lines.forEach((l, i) => txt(l, x, y + i * lh, size, color, align, weight || 600));
  return lines.length * lh;
}
function card(x, y, w, h, r, fill, stroke) {
  ctx.save();
  ctx.shadowColor = 'rgba(60,35,10,.22)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillStyle = fill || '#fffaf0'; rr(x, y, w, h, r); ctx.fill();
  ctx.restore();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; rr(x, y, w, h, r); ctx.stroke(); }
}
// الـ Focus: إطار متوهج بينبض
function focusFrame(x, y, w, h, r, color) {
  const pulse = 0.5 + 0.5 * Math.sin(game.t * 6);
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 16 + 14 * pulse;
  ctx.strokeStyle = color; ctx.lineWidth = 5;
  rr(x - 5, y - 5, w + 10, h + 10, r + 5); ctx.stroke();
  ctx.restore();
}
function button(x, y, w, h, label, focused, size) {

  ctx.strokeStyle = focused ? '#9b2f12' : '#c9a777'; ctx.lineWidth = 3;
  rr(x, y, w, h, 16); ctx.stroke();

}
function glyph(x, y, letter, r) {

// ---- الأرضية: بنرسمها بيكسل بيكسل في صورة صغيرة ونكبّرها ----
const FW = VW / 2, FH = (VH - HORIZON) / 2;
const floorCv = makeCanvas(FW, FH), floorCtx = floorCv.getContext('2d');
const floorImg = floorCtx.createImageData(FW, FH);
const floorPx = new Uint32Array(floorImg.data.buffer);
const rowDist = new Float32Array(FH);
const rowKA = new Uint32Array(FH), rowKB = new Uint32Array(FH), rowDA = new Uint32Array(FH), rowDB = new Uint32Array(FH);
(function initFloorRows() {
  const pack = (c) => (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0];
  const mixTo = (c, m, f) => [0, 1, 2].map(i => Math.round(c[i] + (m[i] - c[i]) * f));
  const KA = [245, 233, 208], KB = [222, 198, 158], KM = [234, 216, 184];
  const DA = [251, 243, 228], DB = [208, 132, 98], DM = [232, 192, 166];
  for (let r = 0; r < FH; r++) {
    const d = EYE * FOCAL / ((r + 0.5) * 2);
    rowDist[r] = d;
    const f = clamp((d - 2.5) / 9, 0, 0.85);
    rowKA[r] = pack(mixTo(KA, KM, f)); rowKB[r] = pack(mixTo(KB, KM, f));
    rowDA[r] = pack(mixTo(DA, DM, f)); rowDB[r] = pack(mixTo(DB, DM, f));
  }
})();

function drawFloor(p, cam) {
  const lx = cam.dirX - cam.plX, ly = cam.dirY - cam.plY;
  const sx = 2 * cam.plX / FW, sy = 2 * cam.plY / FW;
  let o = 0;
  for (let r = 0; r < FH; r++) {
    const d = rowDist[r];
    const dx = d * sx, dy = d * sy;
    let wx = p.x + d * lx + dx * 0.5, wy = p.y + d * ly + dy * 0.5;
    const ka = rowKA[r], kb = rowKB[r], da = rowDA[r], db = rowDB[r];
    for (let c = 0; c < FW; c++) {
      const chk = (Math.floor(wx * 2) + Math.floor(wy * 2)) & 1;
      floorPx[o++] = wy < 2 ? (chk ? da : db) : (chk ? ka : kb);
      wx += dx; wy += dy;
    }
  }
  floorCtx.putImageData(floorImg, 0, 0);
  ctx.drawImage(floorCv, 0, HORIZON, VW, VH - HORIZON);
}

// ---- الحيطان: Raycasting عمود عمود ----
const viewCv = makeCanvas(VW, VH), viewCtx = viewCv.getContext('2d');
const zbuf = new Float32Array(NCOL);
const MAXLOW = NCOL * 14;
const lowCol = new Int16Array(MAXLOW), lowSide = new Uint8Array(MAXLOW);
const lowDist = new Float32Array(MAXLOW), lowExit = new Float32Array(MAXLOW), lowU = new Float32Array(MAXLOW);
const lowCell = new Array(MAXLOW), lowIdx = new Int32Array(MAXLOW);
let lowN = 0;

function castWalls(p, cam) {
  lowN = 0;
  for (let c = 0; c < NCOL; c++) {
    const camX = 2 * (c + 0.5) / NCOL - 1;
    const rx = cam.dirX + cam.plX * camX, ry = cam.dirY + cam.plY * camX;
    let mx = Math.floor(p.x), my = Math.floor(p.y);
    const ddx = Math.abs(1 / rx), ddy = Math.abs(1 / ry);
    let stepX, stepY, sdx, sdy;
    if (rx < 0) { stepX = -1; sdx = (p.x - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - p.x) * ddx; }
    if (ry < 0) { stepY = -1; sdy = (p.y - my) * ddy; } else { stepY = 1; sdy = (my + 1 - p.y) * ddy; }
    let side = 0, dist = 1, cell = '#', u = 0;
    for (let it = 0; it < 48; it++) {
      if (sdx < sdy) { dist = sdx; sdx += ddx; mx += stepX; side = 0; }
      else { dist = sdy; sdy += ddy; my += stepY; side = 1; }
      cell = cellAt(mx, my);
      if (cell === '.') continue;
      u = side === 0 ? p.y + dist * ry : p.x + dist * rx;
      u -= Math.floor(u);
      if ((side === 0 && rx < 0) || (side === 1 && ry > 0)) u = 1 - u;
      if (LOW[cell] !== undefined) {                                       // صندوق واطي: سجّله وكمّل
        if (lowN < MAXLOW) {
          lowCol[lowN] = c; lowSide[lowN] = side; lowDist[lowN] = Math.max(dist, 0.05);
          lowExit[lowN] = Math.min(sdx, sdy); lowU[lowN] = u; lowCell[lowN] = cell; lowN++;
        }
        continue;
      }
      break;
    }
    dist = Math.max(dist, 0.05);
    zbuf[c] = dist;
    const top = HORIZON - (WALL_H - EYE) * FOCAL / dist, bot = HORIZON + EYE * FOCAL / dist;
    const tex = TEX[cell] || TEX['#'];
    ctx.drawImage(side ? tex.d : tex.l, Math.min(TS - 1, (u * TS) | 0), 0, 1, TS, c * COLW, top, COLW, bot - top);
  }
}

// عمود واحد من صندوق واطي: السطح + الوش
function drawLowHit(i) {
  const cell = lowCell[i], h = LOW[cell], d = lowDist[i], e = lowExit[i], x = lowCol[i] * COLW;
  const yTopFront = HORIZON + (EYE - h) * FOCAL / d;
  const yBot = HORIZON + EYE * FOCAL / d;
  const yTopBack = HORIZON + (EYE - h) * FOCAL / e;
  ctx.fillStyle = LOW_TOP[cell];
  ctx.fillRect(x, yTopBack, COLW, yTopFront - yTopBack + 1);
  const tex = TEX[cell];
  ctx.drawImage(lowSide[i] ? tex.d : tex.l, Math.min(TS - 1, (lowU[i] * TS) | 0), 0, 1, TS, x, yTopFront, COLW, yBot - yTopFront);
}

// إسقاط نقطة من العالم على الشاشة
function project(p, cam, x, y, z) {
  const dx = x - p.x, dy = y - p.y;
  const tx = cam.inv * (cam.dirY * dx - cam.dirX * dy);
  const ty = cam.inv * (-cam.plY * dx + cam.plX * dy);
  if (ty < 0.15) return null;
  return { x: (VW / 2) * (1 + tx / ty), y: HORIZON + (EYE - z) * FOCAL / ty, depth: ty };
}

// رسم مجسم مسطح مع اختبار العمق ضد الحيطان عمود بعمود
function drawSpr(s) {
  const pt = s.pt, sc = FOCAL / pt.depth, sw = s.w * sc, sh = s.h * sc;
  const left = pt.x - sw / 2, yt = pt.y - sh, img = s.img;
  const c0 = Math.max(0, Math.floor(left / COLW)), c1 = Math.min(NCOL - 1, Math.floor((left + sw) / COLW));
  let run = -1;
  s.visible = false; s.yTop = yt;
  for (let c = c0; c <= c1 + 1; c++) {
    const vis = c <= c1 && pt.depth < zbuf[c];
    if (vis && run < 0) run = c;
    if (!vis && run >= 0) {
      const xs = Math.max(left, run * COLW), xe = Math.min(left + sw, c * COLW);
      if (xe > xs) {
        ctx.drawImage(img, (xs - left) / sw * img.width, 0, (xe - xs) / sw * img.width, img.height, xs, yt, xe - xs, sh);
        s.visible = true;
      }
      run = -1;
    }
  }
}

function itemSprite(item) {
  if (item.stage === 'dough') return SPR.dough;
  return (item.stage === 'baked' ? SPR.pizza : SPR.pizzaRaw)[game.order.idx];

// رسم منظر اللاعب كله في كانفاس جانبية + تجهيز العناوين اللي هتترسم فوقه
function render3D(p) {
  const keep = ctx; ctx = viewCtx;
  const o = rival(p);
  const dirX = Math.cos(p.a), dirY = Math.sin(p.a);
  const cam = { dirX, dirY, plX: -dirY * PLANE, plY: dirX * PLANE };
  cam.inv = 1 / (cam.plX * cam.dirY - cam.dirX * cam.plY);

  const cg = ctx.createLinearGradient(0, 0, 0, HORIZON);
  cg.addColorStop(0, '#fdf8ec'); cg.addColorStop(1, '#efe0c2');
  ctx.fillStyle = cg; ctx.fillRect(0, 0, VW, HORIZON);
  drawFloor(p, cam);
  castWalls(p, cam);

  // كل المجسمات — bias بيظبط ترتيب الرسم (اللي فوق طاولة بيترسم بعد الطاولة)
  const sprites = [];
  const add = (img, x, y, z, w, h, bias, tag) => {
    const pt = project(p, cam, x, y, z);
    if (!pt) return null;
    const s = { img, pt, w, h, key: pt.depth - (bias || 0), tag };
    sprites.push(s);
    return s;
  };
  add(SPR.customer[(game.round - 1) % 5], CUSTOMER.x, CUSTOMER.y, 0, 0.80, 1.53, 0, 'customer');
  // الشيف الخصم واللي شايله
  add(SPR.chef[o.charIdx][o.id], o.x, o.y, 0, 0.78, 1.5, 0, 'rival');
  if (o.item) add(itemSprite(o.item), o.x, o.y, 0.72, 0.5, 0.25, 0.04);
  // فوق الطاولات والكاونتر
  add(SPR.dough, 5.5, 5.5, LOW.D, 0.7, 0.35, 0.75);
  for (let i = 0; i < 4; i++) add(SPR.plate[i], 4.45 + i * 0.7, 8.5, LOW.T, 0.6, 0.35, 0.75, 'ing' + i);
  game.players.forEach(q => { if (q.finished) add(SPR.pizza[game.order.idx], 5.5 + (q.id ? 0.6 : -0.6), 2.5, LOW.K, 0.6, 0.3, 0.75); });
  // على الأرض: زيت، بيتزا واقعة، صناديق
  game.puddles.forEach(pd => add(SPR.puddle, pd.x, pd.y, 0, 1.0, 0.3, -0.3));
  game.pizzas.forEach(z => add(SPR.pizza[game.order.idx], z.x, z.y, 0.02, 0.75, 0.37, -0.2));
  game.crates.forEach(c => add(SPR.crate[c.type], c.x, c.y, 0.2 + 0.07 * Math.sin(game.t * 3 + c.x), 0.44, 0.44, 0, 'crate:' + c.type));
  // أسهم الهدف
  const tg = p.mini ? null : targetOf(p);
  if (tg) {
    for (const m of tg.pts) {
      const k = clamp(Math.hypot(m.x - p.x, m.y - p.y) / 3.2, 0.3, 1);    // السهم بيصغر لما تقرّب
      add(SPR.arrow, m.x, m.y, m.z + 0.07 * Math.sin(game.t * 6), 0.36 * k, 0.4 * k, m.top ? 0.75 : 0);
    }
  }

  // رسّام من البعيد للقريب: أعمدة الصناديق الواطية والمجسمات مع بعض
  for (let i = 0; i < lowN; i++) lowIdx[i] = i;
  const ord = lowIdx.subarray(0, lowN);
  ord.sort((a, b) => lowDist[b] - lowDist[a]);
  sprites.sort((a, b) => b.key - a.key);
  let si = 0;
  for (let k = 0; k < lowN; k++) {
    const d = lowDist[ord[k]];
    while (si < sprites.length && sprites[si].key >= d) drawSpr(sprites[si++]);
    drawLowHit(ord[k]);
  }
  while (si < sprites.length) drawSpr(sprites[si++]);

  // العناوين اللي هتترسم فوق المنظر
  const labels = [];
  let cust = null;
  for (const s of sprites) {
    if (!s.visible || !s.tag) continue;
    if (s.tag === 'customer') cust = { x: s.pt.x, yTop: s.yTop, visible: true };
    else if (s.tag === 'rival') {
      labels.push({ text: pname(o) + (o.stunT > 0 || o.slipT > 0 ? ' ✶' : ''), x: s.pt.x, y: s.yTop - 12,
                    size: clamp(40 / s.pt.depth, 11, 18), bg: o.accent, fg: '#fff' });
    } else if (s.tag.startsWith('ing') && s.pt.depth < 3.4) {
      labels.push({ text: T('ingredients')[+s.tag.slice(3)], x: s.pt.x, y: s.yTop - 12, size: clamp(26 / s.pt.depth, 11, 17) });
    } else if (s.tag.startsWith('crate:') && s.pt.depth < 5) {
      labels.push({ text: T('items')[s.tag.slice(6)], x: s.pt.x, y: s.yTop - 12, size: clamp(30 / s.pt.depth, 11, 16), bg: '#2f7fd1', fg: '#fff' });
    }
  }
  const tkey = tg ? tg.key : null;
  for (const key in STATIONS) {
    if (key === 'customer' && p.bubble) continue;          // البالون مكان العنوان
    for (const m of STATIONS[key].marks) {
      const isT = key === tkey;
      const pt = project(p, cam, m.x, m.y, m.z + (isT ? 0.56 : 0.1));
      if (!pt || pt.x < -60 || pt.x > VW + 60) continue;
      const col = clamp(Math.floor(pt.x / COLW), 0, NCOL - 1);
      if (pt.depth > zbuf[col] + 0.2) continue;
      labels.push({ text: T('station')[key], x: pt.x, y: pt.y, size: clamp(44 / pt.depth, 12, 22),
                    bg: isT ? '#ffb703' : null, fg: isT ? '#4a2c0a' : '#fff' });
    }
  }
  if (tkey === 'pizza') {
    const m = tg.pts[0], pt = project(p, cam, m.x, m.y, m.z + 0.5);
    if (pt && pt.x > -60 && pt.x < VW + 60) labels.push({ text: T('station').pizza, x: pt.x, y: pt.y, size: clamp(44 / pt.depth, 12, 22), bg: '#ffb703', fg: '#4a2c0a' });
  }
  // لو الهدف برّه مجال الرؤية: نشاور عليه
  let turn = 0;
  if (tg) {
    let best = null;
    for (const m of tg.pts) { const d = Math.hypot(m.x - p.x, m.y - p.y); if (!best || d < best.d) best = { d, m }; }
    const diff = angDiff(Math.atan2(best.m.y - p.y, best.m.x - p.x), p.a);
    if (Math.abs(diff) > 0.52) turn = Math.sign(diff);
  }
  ctx = keep;
  return { cust, labels, turn };
}

// ============================ 10) رسم شاشة اللعب ============================
function hintFor(p) {
  const h = T('hint');
  if (p.finished) return h.done;
  if (p.mini) return h[p.mini + 'Mini'];
  const tg = targetOf(p);
  if (tg && tg.key === 'pizza') return h.grab;
  return h[p.phase];
}

// زرار الأداة (X) وزرار الزقّ (B) في الـ HUD
function drawActionPills(p, x, y) {
  const pw = 124, ph = 30;
  // الأداة
  const has = !!p.inv;
  ctx.fillStyle = has ? '#e3f0fb' : '#ece6da'; rr(x, y, pw, ph, 10); ctx.fill();
  ctx.strokeStyle = has ? '#2f7fd1' : '#b9aa92'; ctx.lineWidth = 2; rr(x, y, pw, ph, 10); ctx.stroke();
  ctx.globalAlpha = has ? 1 : 0.45; glyph(x + 17, y + 15, 'X', 11); ctx.globalAlpha = 1;
  if (has) drawItemIcon(p.inv, x + 42, y + 15, 9);
  txtFit(has ? T('items')[p.inv] : T('noItem'), x + (has ? 86 : 74), y + 16, 14, has ? '#1f5d9c' : '#8a8376', 'center', 700, has ? 66 : 84);
  // الزقّ (بيتملي تاني بعد الاستخدام)
  const x2 = x + pw + 8, ready = p.shoveCd <= 0;
  ctx.fillStyle = '#ece6da'; rr(x2, y, pw, ph, 10); ctx.fill();
  ctx.save(); rr(x2, y, pw, ph, 10); ctx.clip();
  ctx.fillStyle = ready ? '#fbe3e0' : '#d9cfc0';
  ctx.fillRect(x2, y, pw * (ready ? 1 : 1 - p.shoveCd / SHOVE_CD), ph);
  ctx.restore();
  ctx.strokeStyle = ready ? '#d64541' : '#b9aa92'; ctx.lineWidth = 2; rr(x2, y, pw, ph, 10); ctx.stroke();
  ctx.globalAlpha = ready ? 1 : 0.45; glyph(x2 + 17, y + 15, 'B', 11); ctx.globalAlpha = 1;
  txtFit(T('shove'), x2 + 74, y + 16, 14, ready ? '#9b2f2b' : '#8a8376', 'center', 700, 84);
}

// الخريطة الصغيرة + متابعة تقدم اللاعبين
function drawMinimap(p, x, y) {
  const cs = 10, mw = MAP[0].length * cs, mh = MAP.length * cs, o = rival(p);
  ctx.fillStyle = 'rgba(30,18,8,.74)'; rr(x - 6, y - 44, mw + 12, mh + 50, 10); ctx.fill();
  // نقط التقدم: إنت والخصم
  [[T('you'), stageOf(p), p.accent], [T('rival'), stageOf(o), o.accent]].forEach(([label, n, col], r) => {
    const py = y - 32 + r * 16;
    txtFit(label, rtl() ? x + mw : x, py, 11, '#fff', alStart(), 700, 42);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i < n ? col : 'rgba(255,255,255,.25)';
      circle(rtl() ? x + mw - 50 - i * 13 : x + 50 + i * 13, py, 4.5);
    }
  });
  for (let r = 0; r < MAP.length; r++) for (let q = 0; q < MAP[0].length; q++) {
    const c = MAP[r][q];
    if (c === '.') continue;
    ctx.fillStyle = c === 'K' ? '#b07a48' : c === 'D' ? '#f5eddd' : c === 'T' ? '#dcbd90' : c === 'O' ? '#f08a2c' : 'rgba(255,243,223,.26)';
    ctx.fillRect(x + q * cs, y + r * cs, cs, cs);
  }
  ctx.fillStyle = '#9db4e0'; circle(x + CUSTOMER.x * cs, y + CUSTOMER.y * cs, 3.5);
  // الهدف
  const tg = p.mini ? null : targetOf(p);
  if (tg) {
    ctx.strokeStyle = '#ffb703'; ctx.lineWidth = 2;
    for (const m of tg.pts) { ctx.beginPath(); ctx.arc(x + m.x * cs, y + m.y * cs, 6 + 2 * Math.sin(game.t * 6), 0, Math.PI * 2); ctx.stroke(); }
  }
  game.puddles.forEach(pd => { ctx.fillStyle = 'rgba(224,168,28,.8)'; circle(x + pd.x * cs, y + pd.y * cs, 3); });
  game.crates.forEach(c => { ctx.fillStyle = '#6fb6ff'; ctx.fillRect(x + c.x * cs - 3, y + c.y * cs - 3, 6, 6); });
  game.pizzas.forEach(z => { ctx.fillStyle = '#ffb703'; circle(x + z.x * cs, y + z.y * cs, 4); });
  // الخصم ثم أنا (سهم باتجاه النظر)
  ctx.fillStyle = o.accent; circle(x + o.x * cs, y + o.y * cs, 4.5);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x + o.x * cs, y + o.y * cs, 4.5, 0, Math.PI * 2); ctx.stroke();
  ctx.save(); ctx.translate(x + p.x * cs, y + p.y * cs); ctx.rotate(p.a);
  ctx.fillStyle = p.accent; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -5.5); ctx.lineTo(-2, 0); ctx.lineTo(-5, 5.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// اللي اللاعب شايله قدامه
function drawHeld(p) {
  if (!p.item) return;
  const look = p.item.stage === 'dough' ? {} : pizzaLook(game.order, p.item.stage === 'baked');
  const bob = p.moving ? Math.sin(p.walk) * 5 : 0;

  rr(cx - 198, cy + 6, 72, 110, 22); ctx.fill(); rr(cx + 126, cy + 6, 72, 110, 22); ctx.fill();
  ctx.fillStyle = '#f6cfa5'; circle(cx - 158, cy + 8, 23); circle(cx + 158, cy + 8, 23);
  ctx.fillStyle = '#8a5a34'; ellipse(cx, cy + 5, 162, 50);
  ctx.fillStyle = '#c99562'; ellipse(cx, cy, 160, 48);
  ctx.save(); ctx.translate(cx, cy - 5); ctx.scale(1, 0.3); drawPizza(0, 0, 130, 0, look); ctx.restore();
}
// إيدين الزقّة
function drawLunge(p) {
  if (p.lungeT <= 0) return;
  const k = Math.sin((1 - p.lungeT / 0.25) * Math.PI), cx = VW / 2, hy = VH - 60 - 150 * k;

}
// ضلمة راوند "النور قطع": كشاف في النص
function drawBlackout() {

// كل اللي بيترسم فوق المنظر
function drawViewOverlays(p, ov) {
  for (const l of ov.labels) pill(l.text, clamp(l.x, 50, VW - 50), l.y, l.size, l.bg || 'rgba(60,36,14,.78)', l.fg || '#fff');
  if (ov.turn) {                                   // سهم "لفّ ناحية الهدف"
    const b = 8 * Math.sin(game.t * 7) * ov.turn;
    const x = (ov.turn > 0 ? VW - 44 : 44) + b;
    ctx.fillStyle = '#ffb703'; ctx.strokeStyle = '#7a3b10'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 22 * ov.turn, HORIZON); ctx.lineTo(x - 14 * ov.turn, HORIZON - 30); ctx.lineTo(x - 14 * ov.turn, HORIZON + 30);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if (p.boostT > 0) {                              // وهج الشطة على الأطراف
    const g = ctx.createRadialGradient(VW / 2, VH / 2, 220, VW / 2, VH / 2, 460);
    g.addColorStop(0, 'rgba(228,87,46,0)'); g.addColorStop(1, 'rgba(228,87,46,.5)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }
  if (p.stunT > 0) { ctx.fillStyle = 'rgba(200,54,43,' + (0.35 * p.stunT / STUN_TIME) + ')'; ctx.fillRect(0, 0, VW, VH); }
  drawHeld(p);
  drawLunge(p);
  pill(hintFor(p), VW / 2, 26, 16, 'rgba(45,28,12,.78)', '#fff');
  if (p.bubble) {
    if (ov.cust && ov.cust.x > 20 && ov.cust.x < VW - 20) drawBubble(ov.cust.x, Math.max(ov.cust.yTop - 14, 150), p.bubble.text, true);
    else drawBubble(VW / 2, 150, p.bubble.text, false);
  }
  // "اضغط A" لما يوصل للمحطة ويبص عليها
  if (!p.finished && p.phase !== 'order' && p.stunT <= 0 && p.slipT <= 0 && canUse(p, PHASE_STATION[p.phase])) {
    const label = T('act')[p.phase];
    ctx.font = '800 20px ' + FONT;
    const w = ctx.measureText(label).width + 78, x = VW / 2 - w / 2, y = HORIZON + 78 + 3 * Math.sin(game.t * 8);
    ctx.fillStyle = 'rgba(45,28,12,.85)'; rr(x, y, w, 46, 23); ctx.fill();
    glyph(rtl() ? x + w - 26 : x + 26, y + 23, 'A', 16);
    txt(label, rtl() ? x + (w - 46) / 2 + 4 : x + 46 + (w - 46) / 2 - 4, y + 24, 20, '#fff', 'center', 800);
  }
  if (p.finished) {
    const cy = VH - 150;
    card(210, cy, 300, 88, 16, '#fffaf0', p.accent);
    txt(T('delivered'), 360, cy + 28, 23, p.accent, 'center', 800);
    txt(T('roundScore', p.scores.total), 360, cy + 60, 20, '#3b2a20', 'center', 700);
  }
  drawMinimap(p, p.id === 0 ? 14 : VW - 14 - MAP[0].length * 10, VH - 12 - MAP.length * 10);
}

// --- رسم الميني جيمز ---
function miniPanel(p, title) {

  const o = rival(p);
  if (Math.hypot(o.x - p.x, o.y - p.y) < 2.4 && Math.sin(game.t * 12) > -0.3) pill(T('rivalClose'), 320, 36, 17, '#c8362b', '#fff');
}
// جودة الخصم في نفس المرحلة: عشان تعرف لازم تكسر كام
function rivalStageQ(p, key) {
  const o = rival(p), it = o.item || o.servedItem;
  if (it && it.maker === o.id) {
    if (key === 'dough') return it.dough;
    if (key === 'toppings' && it.stage !== 'dough') return it.toppings;
    if (key === 'bake' && it.stage === 'baked') return it.bake;
  }
  if (key === 'dough' && !it && (o.dough.step > 0 || o.dough.folds > 0)) return doughQuality(o.dough);
  return null;
}
function qualityLine(p, y, mine, key) {
  const o = rival(p), rq = rivalStageQ(p, key);
  txt(T('quality', Math.round(mine * 100)), sideStart(50, 590, 34), y, 18, p.accent, alStart(), 800);
  txt(rq === null ? T('rivalNone') : T('rivalQ', Math.round(rq * 100)), sideEnd(50, 590, 34), y, 18, o.accent, alEnd(), 800);
}
function stickPointer(d, cx, cy, R) {
  const px = cx + d.px * R, py = cy - d.py * R;
  ctx.fillStyle = 'rgba(47,127,209,.35)'; circle(px, py, 14);

}

function drawDough(p) {
  const d = p.dough, cx = 320, cy = 326;

    ctx.fillStyle = done ? '#3aa655' : cur ? '#e4572e' : '#efe2c8';

// التقنية 1: العجن
function drawKnead(d, cx, cy, R) {
  ctx.strokeStyle = '#eadbbd'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  if (d.prog > 0.01) {                              // تقدم الطيّة الحالية
    ctx.strokeStyle = '#e4572e'; ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -(Math.PI / 2 + d.dir * d.prog), d.dir > 0); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  for (let k = 0; k < 6; k++) {                     // أسهم الاتجاه المطلوب
    const th = k * Math.PI / 3 + d.dir * game.t * 1.6;
    ctx.save(); ctx.translate(cx + Math.cos(th) * (R + 26), cy - Math.sin(th) * (R + 26));
    ctx.rotate(-(th + d.dir * Math.PI / 2));
    ctx.fillStyle = '#b23a1e'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const sq = 1 + 0.08 * Math.sin(d.prog * 2);       // كورة العجين بتتطبّق
  ctx.fillStyle = '#e8d3a2'; ellipse(cx, cy, 62 * sq, 56 / sq);
  ctx.fillStyle = '#f4e6c0'; ellipse(cx - 14, cy - 12, 30, 20);
  ctx.strokeStyle = 'rgba(160,120,60,.5)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, 36, -d.dir * d.prog, -d.dir * d.prog + 2.2); ctx.stroke();
  stickPointer(d, cx, cy, R);
  // عدّاد السرعة: الأخضر مسموح، الأحمر بيقطّع العجينة
  const gx = 170, gw = 300, gy = 470, maxS = KNEAD_MAX * 1.7;
  ctx.fillStyle = '#c8362b'; rr(gx, gy, gw, 14, 7); ctx.fill();
  ctx.fillStyle = '#3aa655'; rr(gx, gy, gw * (KNEAD_MAX / maxS), 14, 7); ctx.fill();
  ctx.fillStyle = '#2b1d14'; ctx.fillRect(gx + gw * Math.min(1, d.speed / maxS) - 2.5, gy - 6, 5, 26);

// التقنية 2: الفرد
function drawShape(d, cx, cy, R) {
  ctx.fillStyle = '#f3e7cf'; circle(cx, cy, R + 12);
  ctx.strokeStyle = '#d9c7a3'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  // القطاعات: أخضر لو قريب من المثالي، أحمر لو بعيد
  const da = Math.PI * 2 / SECTORS;
  for (let i = 0; i < SECTORS; i++) {
    if (!d.painted[i]) continue;
    const k = Math.min(1, Math.abs(d.radii[i] - IDEAL_R) / 0.3);
    ctx.fillStyle = 'hsl(' + (120 * (1 - k)) + ',62%,50%)';
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, d.radii[i] * R, -(i + 1) * da - 0.004, -i * da + 0.004);
    ctx.closePath(); ctx.fill();
  }
  ctx.save();                                       // Ghost Circle: الحلقة المثالية
  ctx.setLineDash([8, 7]); ctx.strokeStyle = 'rgba(90,60,30,.6)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, IDEAL_R * R, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  stickPointer(d, cx, cy, R);
  txt(T('coverage', Math.round(d.coverage * 100)), rtl() ? 440 : 200, 470, 19, '#3b2a20', 'center', 700);
  txt(T('shapeQ', Math.round((d.smooth * 0.5 + d.acc * 0.5) * 100)), rtl() ? 200 : 440, 470, 19, '#3b2a20', 'center', 700);
  if (d.coverage >= 1) {
    focusFrame(130, 494, 380, 42, 12, '#3aa655');
    ctx.fillStyle = '#3aa655'; rr(130, 494, 380, 42, 12); ctx.fill();
    txtFit(T('doughReady'), 320, 516, 20, '#fff', 'center', 800, 350);
  } else txtFit(T('shapeTip'), 320, 516, 16, '#8a6a4a', 'center', 600, 500);
}

// التقنية 3: الرمي واللف
function drawToss(d, cx) {
  const by = 430, u = d.air < 0 ? 0 : d.air / TOSS_AIR;
  const h = d.air < 0 ? 0 : Math.max(0, 4 * u * (1 - u));
  txt(T('tossN', Math.min(d.tosses + 1, TOSSES), TOSSES), cx, 202, 18, '#8a6a4a', 'center', 700);
  ctx.fillStyle = 'rgba(90,60,30,.16)'; ellipse(cx, by + 8, 80 - 34 * h, 18 - 8 * h);
  ctx.strokeStyle = '#3aa655'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(cx, by, 76, 22, 0, 0, Math.PI * 2); ctx.stroke();
  if (d.air >= 0) {                                 // حلقة التوقيت بتقفل لحد لحظة المسك
    const k = Math.max(0, 1 - u);
    ctx.strokeStyle = '#e4572e'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(cx, by, 76 + 150 * k, 22 + 44 * k, 0, 0, Math.PI * 2); ctx.stroke();
  }
  const rad = 60 + Math.min(18, d.spin * 7);
  ctx.save(); ctx.translate(cx, by - 12 - h * 180); ctx.scale(1, 0.4 + 0.32 * h);
  ctx.fillStyle = '#e8d3a2'; circle(0, 0, rad);
  ctx.fillStyle = '#f4e6c0'; circle(0, 0, rad * 0.8);
  ctx.rotate(-d.rot);
  ctx.strokeStyle = 'rgba(160,120,60,.55)'; ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, rad * 0.55, i * 2.1, i * 2.1 + 1.1); ctx.stroke(); }
  ctx.restore();
  if (d.showT > 0 && d.lastCatch) {
    const colors = ['#3aa655', '#d9a400', '#e07b22', '#c8362b'];
    txt(T('catchLabels')[d.lastCatch.zi], cx, 494, 28, colors[d.lastCatch.zi], 'center', 800);
    if (d.lastCatch.zi < 3) txt(T('spinLabel', d.lastCatch.spin.toFixed(1)), cx, 526, 17, '#8a6a4a', 'center', 700);
  } else if (d.doneT > 0) {
    txt('✓', cx, 500, 40, '#3aa655', 'center', 800);
  } else if (d.air < 0) {
    const b = 6 * Math.sin(game.t * 8);
    ctx.fillStyle = '#e4572e'; ctx.beginPath(); ctx.moveTo(cx, 268 - b); ctx.lineTo(cx - 20, 298 - b); ctx.lineTo(cx + 20, 298 - b); ctx.closePath(); ctx.fill();
    ctx.fillRect(cx - 7, 296 - b, 14, 26);
    txtFit(T('tossTip'), cx, 506, 18, '#3b2a20', 'center', 700, 500);
  } else {
    txtFit(T('tossAir'), cx, 506, 18, '#b23a1e', 'center', 800, 500);
  }
}

// المكونات: البيتزا بتلف تحت الصبّابة
function drawToppings(p) {
  const t = p.top, cx = 320, cy = 338, R = 100;
  miniPanel(p, T('topTitle') + ' — ' + orderName(game.order));
  const bw = 118, bh = 42, gap = 10, x0 = 320 - (4 * bw + 3 * gap) / 2, y = 116;
  for (let i = 0; i < 4; i++) {
    let x = x0 + (rtl() ? 3 - i : i) * (bw + gap);
    const wrongNow = t.shake > 0 && t.wrongIdx === i, cur = t.mode === 'drop' && t.cur === i;
    if (wrongNow) x += Math.sin(game.t * 60) * 5;
    if (t.mode === 'pick' && t.focus === i && t.doneT <= 0) focusFrame(x, y, bw, bh, 12, '#ffb703');
    ctx.fillStyle = wrongNow ? '#f6c7c2' : t.done[i] ? '#d8f0d6' : cur ? '#ffe2b8' : '#fff3df';
    rr(x, y, bw, bh, 12); ctx.fill();
    ctx.strokeStyle = wrongNow ? '#c8362b' : t.done[i] ? '#3aa655' : cur ? '#e07b22' : '#c9a777'; ctx.lineWidth = 2.5;
    rr(x, y, bw, bh, 12); ctx.stroke();
    drawIngredient(i, x + 22, y + bh / 2, 15, true);
    txtFit(T('ingredients')[i] + (t.done[i] ? ' ✓' : ''), x + 74, y + bh / 2 + 1, 16, '#3b2a20', 'center', 800, 76);
  }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t.rot);
  ctx.fillStyle = '#e3cf9c'; circle(0, 0, R);
  ctx.fillStyle = '#f4e6c0'; circle(0, 0, R * 0.9);
  ctx.strokeStyle = 'rgba(160,120,60,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-R * 0.9, 0); ctx.lineTo(-R * 0.8, 0); ctx.stroke();      // علامة صغيرة تبيّن اللف
  for (let i = 0; i < 4; i++) for (const a of t.placed[i]) drawIngredient(i, Math.cos(a) * RING[i] * R, Math.sin(a) * RING[i] * R, PIECE[i], true);
  if (t.mode === 'drop') {
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#b23a1e'; ctx.lineWidth = 2.5;
    for (const mk of t.marks) {
      if (mk.filled) continue;
      ctx.beginPath(); ctx.arc(Math.cos(mk.ang) * RING[t.cur] * R, Math.sin(mk.ang) * RING[t.cur] * R, PIECE[t.cur] + 3, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(120,110,100,.6)';
    for (const a of t.strays) circle(Math.cos(a) * RING[t.cur] * R, Math.sin(a) * RING[t.cur] * R, 5);
  }
  ctx.restore();
  if (t.mode === 'drop') {                          // الصبّابة ومكان نزول القطعة
    const ly = cy - RING[t.cur] * R;
    ctx.strokeStyle = '#2b1d14'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, ly, PIECE[t.cur] + 8, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#2b1d14';
    ctx.beginPath(); ctx.moveTo(cx, cy - R - 3); ctx.lineTo(cx - 11, cy - R - 22); ctx.lineTo(cx + 11, cy - R - 22); ctx.closePath(); ctx.fill();
  }
  qualityLine(p, 464, topQuality(t), 'toppings');
  if (t.doneT > 0) txt(T('topOk'), 320, 494, 22, '#3aa655', 'center', 800);
  else if (t.msgT > 0) txt(t.msg === 'wrong' ? T('topWrong') : T('topMiss'), 320, 494, 22, '#c8362b', 'center', 800);
  else txtFit(t.mode === 'pick' ? T('topPick') : T('topDrop'), 320, 494, 16, '#3b2a20', 'center', 700, 500);
  txtFit(T('topStats', t.wrong, t.waste), 320, 524, 14, '#8a6a4a', 'center', 600, 500);
}

function renderPlay() {
  game.players.forEach((p, i) => {
    const ox = i * HALF;
    const ov = render3D(p);                         // المنظور الأول في كانفاس جانبية
    ctx.save();
    ctx.beginPath(); ctx.rect(ox, 0, HALF, H); ctx.clip();
    // رجّة الكاميرا لما يتزق
    const sh = p.stunT > 0 ? 14 * p.stunT / STUN_TIME : 0;
    ctx.fillStyle = '#2b1d14'; ctx.fillRect(ox, HUD_H, HALF, VH);
    ctx.drawImage(viewCv, ox + Math.sin(game.t * 70) * sh, HUD_H + Math.cos(game.t * 55) * sh * 0.6);
    drawHUD(p, ox);
    ctx.save(); ctx.translate(ox, HUD_H);
    if (game.mod === 'blackout') drawBlackout();
    if (!p.mini) drawViewOverlays(p, ov);
    ctx.save(); ctx.translate(0, 12);
    if (p.mini === 'dough') drawDough(p);
    else if (p.mini === 'toppings') drawToppings(p);
    else if (p.mini === 'bake') drawBake(p);
    ctx.restore();
    if (p.toast) pill(p.toast.text, VW / 2, 66, 18, p.toast.color, '#fff');
    ctx.restore();
    if (p.flourT > 0) drawFlour(ox, p.flourT);
    ctx.restore();
  });
  // الفاصل بين النصين + رقم الراوند ومفاجأته
  ctx.fillStyle = '#5b3a21'; ctx.fillRect(HALF - 3, 0, 6, H);
  const modName = T('mods')[game.mod][0];
  const badge = game.mod === 'sudden' ? modName : T('roundBadge', game.round, ROUNDS) + ' · ' + modName;
  pill(badge, HALF, H - 24, 17, '#5b3a21', '#fff3df');
  if (game.countT > 0) drawCountdown();
  else if (game.goT > 0) txt(T('go'), HALF, 300, 110 + 40 * (0.9 - game.goT), 'rgba(228,87,46,' + Math.min(1, game.goT * 2) + ')', 'center', 800);
  if (game.roundOver) {
    card(HALF - 210, 318, 420, 84, 18, '#8a3a1e');
    txt(game.timeLeft <= 0 ? T('timeUp') : T('roundOver'), HALF, 361, 40, '#fff', 'center', 800);
  }
  if (game.paused) drawPause();
}

  T('cook').forEach((s, i) => {
    ctx.fillStyle = '#e4572e'; circle(rtl() ? colA + colW - 14 : colA + 14, y, 14);
    txt(String(i + 1), rtl() ? colA + colW - 14 : colA + 14, y + 1, 16, '#fff', 'center', 800);
    y += para(s, colText(colA), y, colW - 50, 16, 21, '#3b2a20', alStart(), 600) + 11;
  });
  // اتخانق
  txt(T('fightTitle'), colStart(colB), 124, 26, '#2a9d8f', alStart(), 800);
  y = 164;
  const icons = ['B', null, 'X', null];
  T('fight').forEach((s, i) => {
    const ix = rtl() ? colB + colW - 14 : colB + 14;
    if (icons[i]) glyph(ix, y, icons[i], 13);
    else { ctx.fillStyle = '#2a9d8f'; circle(ix, y, 6); }
    y += para(s, colText(colB), y, colW - 50, 16, 21, '#3b2a20', alStart(), 600) + 14;
  });
  ctx.fillStyle = '#e8d9bd'; ctx.fillRect(140, 530, 1000, 2);
  txtFit(T('rulesScore'), 640, 560, 18, '#6b4a2e', 'center', 700, 1000);
  button(470, 610, 340, 66, T('rulesGo'), true, 30);
  txt(T('back'), sideStart(100, 1180, 90), 644, 18, '#8a6a4a', 'center', 700);
  drawDisconnectBanner();
}

function renderRoundResult() {
  drawMenuBg();
  const sudden = game.round > ROUNDS;
  txt(sudden ? T('resSudden') : T('resTitle', game.round, ROUNDS), 640, 44, 38, '#8a3a1e', 'center', 800);
  txt(T('mods')[game.mod][0], 640, 80, 18, '#8a6a4a', 'center', 700);
  const [a, b] = game.players;
  const lead = a.scores.total === b.scores.total ? -1 : (a.scores.total > b.scores.total ? 0 : 1);
  const maxes = [30, 30, 20, 20, (game.mod === 'rush' ? 20 : 10) + 3 * CRAFT_BONUS];
  const craftKeys = ['toppings', 'dough', 'bake'];
  game.players.forEach((p, i) => {
    const x = i === 0 ? 70 : 670, y = 104, w = 540, h = 496, sc = p.scores, x1 = x + w;
    card(x, y, w, h, 22, '#fffaf0', p.accent);
    drawChar(CHARS[p.charIdx], sideStart(x, x1, 66), y + 58, 1.6, p.accent);
    txt(pname(p), sideStart(x, x1, 114), y + 40, 29, p.accent, alStart(), 800);
    const sub = !sc.served ? T('resNoPizza') : orderName(game.order) + (sc.stolen ? ' · ' + T('resStolen') : '');
    txtFit(sub, sideStart(x, x1, 114), y + 74, 17, sc.stolen ? '#c8362b' : '#8a6a4a', alStart(), 700, 250);
    if (lead === i) {
      const bx = rtl() ? x + 22 : x1 - 22 - 150;
      ctx.fillStyle = '#ffb703'; rr(bx, y + 26, 150, 34, 10); ctx.fill();
      txtFit(T('resWon'), bx + 75, y + 44, 17, '#5b3a21', 'center', 800, 136);
    }
    const vals = [sc.toppings, sc.dough, sc.bake, sc.speed, sc.bonus + sc.craft];
    const barX = rtl() ? x + 150 : x + 180, barW = 210;
    T('resRows').forEach((label, k) => {
      const ry = y + 126 + k * 38, frac = Math.min(1, vals[k] / maxes[k]);
      txtFit(label, sideStart(x, x1, 40), ry, 19, '#3b2a20', alStart(), 700, 130);
      ctx.fillStyle = '#efe2c8'; rr(barX, ry - 7, barW, 14, 7); ctx.fill();
      if (vals[k] > 0) {
        ctx.fillStyle = k === 4 ? '#ffb703' : p.accent;
        rr(rtl() ? barX + barW * (1 - frac) : barX, ry - 7, Math.max(14, barW * frac), 14, 7); ctx.fill();
      }
      txt(k === 4 ? '+' + vals[k] : T('of', vals[k], maxes[k]), sideEnd(x, x1, 40), ry, 18, '#6b4a2e', alEnd(), 700);
      // نجمة "الأحسن" في مبارزة الصنعة
      if (k < 3 && sc.awards[craftKeys[k]]) pill('★ +' + CRAFT_BONUS, rtl() ? barX + 32 : barX + barW - 32, ry, 13, '#ffb703', '#5b3a21');
    });
    ctx.fillStyle = '#e8d9bd'; ctx.fillRect(x + 36, y + 312, w - 72, 2);
    txt(T('resRound'), sideStart(x, x1, 40), y + 348, 23, '#3b2a20', alStart(), 800);
    txt(String(sc.total), sideEnd(x, x1, 40), y + 348, 34, p.accent, alEnd(), 800);
    if (sc.mult > 1) pill(T('resDouble'), sideEnd(x, x1, 130), y + 348, 16, '#ffb703', '#5b3a21');
    txt(T('resTotal'), sideStart(x, x1, 40), y + 394, 21, '#6b4a2e', alStart(), 700);
    txt(String(p.total), sideEnd(x, x1, 40), y + 394, 27, '#3b2a20', alEnd(), 800);
    if (p.bubble) {
      const lines = wrapText(T('resCustomer', p.bubble.text), w - 70, 16, 600);
      lines.slice(0, 2).forEach((l, k) => txt(l, x + w / 2, y + 438 + k * 22, 16, '#8a6a4a', 'center', 600));
    }
  });
  const tied = game.round === ROUNDS && a.total === b.total;
  button(430, 622, 420, 64, game.round < ROUNDS ? T('resNext') : tied ? T('resTie') : T('resFinal'), true, 26);
  drawDisconnectBanner();
}

// شاشة الفايز + جدول إحصائيات المبارزة
function renderWinner() {
  drawMenuBg();
  const cols = ['#e4572e', '#2a9d8f', '#ffb703', '#2f7fd1', '#c8362b'];
  for (let i = 0; i < 70; i++) {
    const x = rnd(i) * W, sp = 60 + rnd(i + 100) * 90;
    const y = ((game.t * sp + rnd(i + 200) * H) % (H + 40)) - 20;
    ctx.save(); ctx.translate(x, y); ctx.rotate(game.t * (1 + rnd(i + 300) * 3) + i);
    ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(-6, -3, 12, 6);
    ctx.restore();
  }
  const [a, b] = game.players;
  const tie = a.total === b.total;
  const win = a.total >= b.total ? a : b;
  card(170, 52, 940, 508, 28, '#fffaf0', tie ? '#c9a777' : win.accent);
  // ناحية الفايز
  const lx = rtl() ? 880 : 400;
  if (tie) {
    txt(T('tie'), lx, 120, 52, '#8a3a1e', 'center', 800);
    drawChar(CHARS[a.charIdx], lx - 90, 290, 3.2, a.accent);
    drawChar(CHARS[b.charIdx], lx + 90, 290, 3.2, b.accent);
    txtFit(T('tieNote'), lx, 450, 20, '#8a6a4a', 'center', 700, 400);
  } else {
    txt(T('winTitle'), lx, 106, 38, '#8a3a1e', 'center', 800);
    drawPizza(lx, 262, 100, game.t * 0.5, FULL_PIZZA);
    drawChar(CHARS[win.charIdx], lx, 278, 3.4, win.accent);
    txt(pname(win), lx, 410, 50, win.accent, 'center', 800);
    txt(T('winTotal', win.total), lx, 466, 28, '#3b2a20', 'center', 800);
  }
  // جدول الإحصائيات
  const tx0 = rtl() ? 210 : 640, tx1 = tx0 + 430;
  const c1 = rtl() ? tx0 + 110 : tx1 - 110, c2 = rtl() ? tx0 + 30 : tx1 - 30;
  drawChar(CHARS[a.charIdx], c1, 112, 0.9, a.accent);
  drawChar(CHARS[b.charIdx], c2, 112, 0.9, b.accent);
  const rows = [[a.total, b.total], [a.stats.rounds, b.stats.rounds], [a.stats.firsts, b.stats.firsts],
                [a.stats.shoves, b.stats.shoves], [a.stats.steals, b.stats.steals], [a.stats.perfects, b.stats.perfects]];
  T('statRows').forEach((label, k) => {
    const y = 176 + k * 58;
    ctx.fillStyle = k % 2 ? '#fff3df' : '#f7ead0'; rr(tx0, y - 24, 430, 48, 10); ctx.fill();
    txtFit(label, sideStart(tx0, tx1, 18), y, 20, '#3b2a20', alStart(), 700, 230);
    const [va, vb] = rows[k];
    txt(String(va), c1, y, va > vb ? 26 : 22, va > vb ? a.accent : '#6b4a2e', 'center', 800);
    txt(String(vb), c2, y, vb > va ? 26 : 22, vb > va ? b.accent : '#6b4a2e', 'center', 800);
  });
  button(rtl() ? 660 : 340, 596, 280, 68, T('again'), game.winnerIdx === 0, 26);
  button(rtl() ? 340 : 660, 596, 280, 68, T('exit'), game.winnerIdx === 1, 26);
  drawDisconnectBanner();
}

function drawDisconnectBanner() {
  const missing = game.players.filter(p => p.pad !== null && !padOK(p));
  if (!missing.length) return;
  ctx.fillStyle = '#c8362b'; rr(300, 16, 680, 40, 12); ctx.fill();
  txtFit(T('discBanner', missingNames(missing)), 640, 37, 19, '#fff', 'center', 800, 650);
}

function render() {
  ctx = mainCtx;                    // أمان: لو أي رسم جانبي اتقطع، نرجع للكانفاس الأساسية
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.direction = rtl() ? 'rtl' : 'ltr';
  ctx.lineJoin = 'round';
  switch (game.screen) {
    case 'welcome':     renderWelcome(); break;
    case 'bind':        renderBind(); break;
    case 'charselect':  renderCharSelect(); break;
    case 'rules':       renderRules(); break;
    case 'play':        renderPlay(); break;
    case 'roundResult': renderRoundResult(); break;
    case 'winner':      renderWinner(); break;
  }
}

// ============================ 12) الحلقة الرئيسية ============================
buildAssets();

function tick(dt) {
  game.t += dt;
  game.screenTime += dt;
  pollGamepads();       // navigator.getGamepads() كل فريم
  update(dt);
  render();
}

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;
  tick(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// للفحص من الكونسول فقط
window.PizzaSpin = { game, tick };
</script>
</body>
</html>
